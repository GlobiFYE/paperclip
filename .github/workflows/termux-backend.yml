name: Paperclip Backend Bundle

on:
  push:
    branches:
      - fix/render-production-workspace-exports
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: |
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/shared build
          pnpm --filter @paperclipai/db build
          pnpm --filter @paperclipai/plugin-sdk build
          pnpm --filter @paperclipai/paperclip-runner build
          pnpm --filter @paperclipai/server build
          pnpm --filter @paperclipai/adapter-utils build
          pnpm --filter @paperclipai/ui build

      - name: Package source and build outputs
        run: |
          mkdir -p "$RUNNER_TEMP/paperclip-bundle"
          tar -czf "$RUNNER_TEMP/paperclip-source.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='**/target' \
            .

          cp "$RUNNER_TEMP/paperclip-source.tar.gz" "$RUNNER_TEMP/paperclip-bundle/"

          mkdir -p "$RUNNER_TEMP/paperclip-bundle/server-dist"
          cp -R server/dist "$RUNNER_TEMP/paperclip-bundle/server-dist/"
          cp -R packages/paperclip-runner/dist "$RUNNER_TEMP/paperclip-bundle/runner-dist/"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-termux-bundle
          path: ${{ runner.temp }}/paperclip-bundle/
          retention-days: 3
