name: Paperclip Backend Bundle

on:
  push:
    branches:
      - fix/render-production-workspace-exports
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/render-production-workspace-exports

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: |
          pnpm run preflight:workspace-links
          pnpm -r --if-present build

      - name: Verify server build
        run: |
          test -f server/dist/index.js
          test -d server/dist

      - name: Package source and build outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/paperclip-bundle"

          tar -czf "$RUNNER_TEMP/paperclip-bundle/paperclip-source.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='**/target' \
            .

          cp .env.example "$RUNNER_TEMP/paperclip-bundle/" 2>/dev/null || true

          cat > "$RUNNER_TEMP/paperclip-bundle/BUILD-INFO.txt" <<EOF
          Repository: prabhurajvardhan/paperclip
          Branch: fix/render-production-workspace-exports
          Commit: $GITHUB_SHA
          Node.js: 24
          pnpm: 9.15.4
          Note: Source archive and build outputs are included.
          EOF

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-termux-bundle
          path: ${{ runner.temp }}/paperclip-bundle/
          if-no-files-found: error
          retention-days: 3
